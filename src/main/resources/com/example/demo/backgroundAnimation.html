<!DOCTYPE html>
<html>
<head>
    <style>
        body, html {
            height: 100%;
            margin: 0;
        }

        #video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1; /* Ensure video is behind other content */
        }

        video {
            object-fit: cover;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="video-container">
        <video autoplay loop muted playsinline>
            <source src="image/v.mp4" type="video/mp4">
            <!-- Add additional video sources for different formats if needed -->
        </video>
    </div>
</body>
</html>
